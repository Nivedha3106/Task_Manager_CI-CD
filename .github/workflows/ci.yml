name: Node.js API CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/actions/checkout@v4

    # Setup automated Node environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: 'npm' # Caches your node_modules to optimize workflow speed

    # Clean install your exact package specifications
    - name: Install dependencies
      run: npm ci

    # Run the comprehensive test suite
    - name: Run API integration tests
      run: npm test
