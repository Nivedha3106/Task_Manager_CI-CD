name: Node.js Dockerized CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  container-build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Copy your code onto the clean Linux runner environment
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Step 2: Set up Docker Buildx (Enables advanced caching features)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 3: Compile the multi-stage container and trigger internal testing
    - name: Build Docker Image and Execute Tests
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        load: true # Loads the finished image into the local runner's context
        tags: task-manager-app:latest
        cache-from: type=gha # Speeds up builds by utilizing GitHub Actions global cache
        cache-to: type=gha,mode=max
